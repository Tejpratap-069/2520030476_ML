name: Expand SentinelFlow DDoS Project

on:
  push:
    paths:
      - ".github/workflows/expand-sentinelflow.yml"

permissions:
  contents: write

jobs:
  expand-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and expand final project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_COMMIT="a455b840f6182649674180c23b889a189bd9c1ed"
          ZIP_PATH="PROJECT/DDoS_LSTM_Autoencoder_Project_DYNAMIC_FINAL.zip"

          git show "${ZIP_COMMIT}:${ZIP_PATH}" > /tmp/sentinelflow.zip

          rm -rf /tmp/sentinelflow
          mkdir -p /tmp/sentinelflow
          unzip -q /tmp/sentinelflow.zip -d /tmp/sentinelflow

          SRC="/tmp/sentinelflow/DDoS_LSTM_Autoencoder_Project"
          test -d "${SRC}"

          # Keep the existing PROJECT documents and add the complete source tree beside them.
          rm -rf PROJECT/backend PROJECT/dataset PROJECT/frontend PROJECT/notebooks PROJECT/report PROJECT/results
          cp -a "${SRC}/backend" PROJECT/
          cp -a "${SRC}/dataset" PROJECT/
          cp -a "${SRC}/frontend" PROJECT/
          cp -a "${SRC}/notebooks" PROJECT/
          cp -a "${SRC}/report" PROJECT/
          cp -a "${SRC}/results" PROJECT/
          cp "${SRC}/README.md" PROJECT/README.md
          cp "${SRC}/START_HERE.md" PROJECT/START_HERE.md
          cp "${SRC}/DYNAMIC_DASHBOARD_UPDATE.md" PROJECT/DYNAMIC_DASHBOARD_UPDATE.md

          # Never commit locally installed environments/caches.
          find PROJECT -type d \( -name ".venv" -o -name "venv" -o -name "node_modules" -o -name "__pycache__" \) -prune -exec rm -rf {} +
          find PROJECT -type f -name "*.pyc" -delete

          cat > PROJECT/.gitignore <<'EOF'
.venv/
venv/
node_modules/
__pycache__/
*.pyc
.env
.DS_Store
EOF

          git add PROJECT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Project is already expanded; nothing to commit."
            exit 0
          fi

          git commit -m "Expand final SentinelFlow DDoS project source"
          git push origin HEAD:main
